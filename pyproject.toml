[project]
name = "tstt"
version = "0.1.0"
description = "Read a bond's final terms and base prospectus with Meta's Muse models, configure a bond token, and check every payment against the clause it follows from."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "QuantLib>=1.36",
    "holidays>=0.60",
    "web3>=7.6",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.scripts]
tstt = "tstt.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tstt"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
